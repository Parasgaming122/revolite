name: Generate Sitemap

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'index.html'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL for the sitemap (e.g. https://example.com)'
        required: false
        default: 'https://revolite.works'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap.xml
        run: |
          BASE_URL="${{ github.event.inputs.base_url || 'https://revolite.works' }}"
          echo "Using base URL: $BASE_URL"
          node scripts/generate-sitemap.cjs --base-url "$BASE_URL"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet public/sitemap.xml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to sitemap.xml"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "sitemap.xml has changed"
          fi

      - name: Commit and push sitemap.xml
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          git commit -m "chore: update sitemap.xml [skip ci]"
          git push
